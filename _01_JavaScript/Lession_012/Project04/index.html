<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
      }

      form {
        width: 350px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: #2a5298;
      }

      button {
        padding: 12px;
        background: #2a5298;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1e3c72;
      }

      #result {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        margin-top: 10px;
      }

      #result span {
        color: #2a5298;
      }

      select {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        cursor: pointer;
      }

      select:focus {
        border-color: #2a5298;
      }
    </style>
  </head>
  <body>
    <form>
      <input type="number" id="first" placeholder="Enter First Number" />

      <input type="number" id="second" placeholder="Enter Second Number" />

      <select id="operation">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (×)</option>
        <option value="/">Division (÷)</option>
        <option value="%">Modulo (%)</option>
      </select>

      <button type="submit">Calculate</button>

      <div id="result">Result Is : <span>0</span></div>
    </form>
    <script src="./index.js"></script>
  </body>
</html>
