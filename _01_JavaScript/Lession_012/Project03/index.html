<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
            background:#222;
            color:white;
            font-family:Arial,sans-serif;
        }

        #root{
            text-align:center;
            background:#333;
            padding:30px;
            border-radius:10px;
        }

        span{
            font-size:30px;
            font-weight:bold;
            color:gold;
        }

        button{
            padding:10px 20px;
            margin:10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .in{
            background:green;
            color:white;
        }

        .de{
            background:red;
            color:white;
        }
    </style>
</head>
<body>
    <div id="root">
        <h2>Counter Is : <span>0</span></h2>

        <button class="in">Increment</button>
        <button class="de">Decrement</button>
    </div>

    <script src="./index.js"></script>
</body>
</html>
