<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Quotes</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        #root{
            width:500px;
            min-height:250px;
            background:white;
            border-radius:15px;
            padding:30px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        #quotes{
            min-height:120px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:24px;
            font-weight:500;
            color:#333;
            line-height:1.6;
            margin-bottom:25px;
            padding:10px;
        }

        #button{
            display:inline-block;
            background:#007bff;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        #button:hover{
            background:#0056b3;
            transform:translateY(-2px);
        }

        #button:active{
            transform:scale(0.97);
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="quotes">
            Click the button to generate a quote ✨
        </div>

        <div id="button">
            Generate Quote
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
