
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & Word Counter</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
            padding:20px;
        }

        .container{
            width:900px;
            max-width:100%;
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#243b55;
            margin-bottom:20px;
        }

        textarea{
            width:100%;
            height:300px;
            padding:20px;
            font-size:22px;
            border:2px solid #dcdcdc;
            border-radius:12px;
            resize:none;
            outline:none;
            transition:0.3s;
        }

        textarea:focus{
            border-color:#2a5298;
            box-shadow:0 0 10px rgba(42,82,152,0.3);
        }

        .stats{
            display:flex;
            justify-content:space-between;
            margin-top:25px;
            flex-wrap:wrap;
            gap:15px;
        }

        .card{
            flex:1;
            min-width:200px;
            background:#f5f7fb;
            padding:20px;
            border-radius:12px;
            text-align:center;
        }

        .card h2{
            color:#243b55;
            font-size:24px;
        }

        .card span{
            color:#2a5298;
            font-weight:bold;
        }

        @media(max-width:768px){
            textarea{
                height:220px;
                font-size:18px;
            }

            .stats{
                flex-direction:column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Text & Word Counter</h1>

        <textarea
            id="comment"
            placeholder="Start typing here..."
        ></textarea>

        <div class="stats">
            <div class="card">
                <h2>Text Count: <span id="textCount">0</span></h2>
            </div>

            <div class="card">
                <h2>Word Count: <span id="wordCount">0</span></h2>
            </div>
        </div>
    </div>

    <script src="./index.js"></script>

</body>
</html>
