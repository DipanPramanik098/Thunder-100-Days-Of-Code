<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Child Demo</title>

    <style>
      body {
        background-color: black;
        color: white;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #parent {
        width: 80%;
        margin: 50px auto;
        padding: 20px;
        border: 2px solid white;
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        background-color: #222;
      }

      #parent div {
        width: 100px;
        height: 100px;
        background-color: royalblue;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      #parent div:hover {
        background-color: tomato;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div id="parent">
      <div id="child1">Child1</div>
      <div id="child2">Child2</div>
      <div id="child3">Child3</div>
      <div id="child4">Child4</div>
    </div>

    <div
      id="grandParent"
      style="
        width: 400px;
        height: 400px;
        background: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        id="Parent"
        style="
          width: 250px;
          height: 250px;
          background: lightgreen;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <div
          id="child"
          style="width: 100px; height: 100px; background: coral"
        ></div>
      </div>
    </div>

    <button
      style="
        background: #4caf50;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        margin: 10px;
      "
    >
      Click Me
    </button>

    <script src="./index.js"></script>
  </body>
</html>
