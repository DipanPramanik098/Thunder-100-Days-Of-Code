<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
</head>
<body style="background:#222; text-align:center; padding-top:50px;">

    <button id="red"
        style="background:red;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:10px;">
        RED
    </button>

    <button id="green"
        style="background:green;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:10px;">
        GREEN
    </button>

    <button id="blue"
        style="background:blue;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:10px;">
        BLUE
    </button>

    <button id="yellow"
        style="background:gold;color:black;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:10px;">
        YELLOW
    </button>

    <button id="purple"
        style="background:purple;color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;margin:10px;">
        PURPLE
    </button>

    <button id="black"
        style="background:black;color:white;padding:12px 24px;border:1px solid white;border-radius:8px;cursor:pointer;margin:10px;">
        BLACK
    </button>


    <script src="./index.js"></script>
</body>
</html>
