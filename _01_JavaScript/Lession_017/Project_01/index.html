<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Looping</title>
    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Body */
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fc;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Container */
      div {
        display: flex;
        gap: 20px;
      }

      /* Buttons */
      button {
        width: 140px;
        height: 50px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        transition: all 0.3s ease;
      }

      /* Individual Colors */
      #first {
        background: #3498db;
      }

      #second {
        background: #2ecc71;
      }

      #third {
        background: #e74c3c;
      }

      /* Hover Effect */
      button:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      /* Click Effect */
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div>
      <button id="first"></button>
      <button id="second"></button>
      <button id="third"></button>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
